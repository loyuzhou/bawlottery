<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAW × 台中購物節｜幸運大轉盤</title><style>
:root{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;color:#fff;background:#160b16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 12%,#80304a 0,#350f25 45%,#130b17 100%);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px 16px 60px;text-align:center}.eyebrow{color:#ffd991;letter-spacing:4px;font-weight:900}.title{font-size:clamp(29px,5vw,56px);margin:10px 0 4px;text-shadow:0 4px 20px #0008}.subtitle{color:#ffe5bb;margin:0 0 20px}.stage{position:relative;width:min(92vw,580px);aspect-ratio:1;margin:auto;filter:drop-shadow(0 15px 30px #0009)}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;left:50%;top:-5px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:42px solid #fff3bd;filter:drop-shadow(0 3px 3px #000a);z-index:5}.spin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;width:22%;aspect-ratio:1;border:5px solid #ffe2a0;background:linear-gradient(135deg,#f9c66b,#b61e3e 70%);color:white;font-weight:1000;font-size:clamp(19px,3.5vw,28px);box-shadow:0 4px 18px #0009;cursor:pointer;z-index:6}.spin:disabled{opacity:.75;cursor:wait}.spin small{display:block;font-size:11px}.result{margin:20px auto;max-width:580px;min-height:75px;background:#ffffff12;border:1px solid #ffdb9e77;border-radius:18px;padding:17px;font-size:20px;font-weight:800}.result strong{color:#ffe08a}.prizes{margin:28px auto 0;text-align:left;max-width:850px}.prizes h2{text-align:center;color:#ffdb95}.prize-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.prize{background:#ffffff10;border:1px solid #ffffff25;border-radius:12px;padding:13px 12px;font-size:15px}.prize b{color:#ffd28b}.prize.jackpot{background:#b9274550;border-color:#ffd28b}.tag{display:inline-block;background:#f9d88c;color:#5b1830;border-radius:20px;padding:2px 7px;font-size:11px;font-weight:bold;margin-left:4px}.foot{font-size:12px;color:#f0c9d3;margin-top:22px}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#140617bd;z-index:20;padding:16px}.overlay.show{display:flex}.modal{background:linear-gradient(160deg,#fff3d1,#f6c97c);color:#5a1830;border:6px solid #fff;border-radius:24px;max-width:440px;width:100%;padding:30px 22px;box-shadow:0 20px 80px #000a;text-align:center;animation:pop .45s both}.modal h2{font-size:36px;margin:8px}.modal .award{font-size:26px;font-weight:900}.modal button{margin-top:22px;border:0;background:#a91940;color:white;border-radius:40px;padding:14px 35px;font-size:18px;font-weight:bold;cursor:pointer}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}.confetti{position:fixed;top:-30px;width:10px;height:18px;z-index:30;pointer-events:none;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:0}}@media(max-width:500px){.wrap{padding-top:18px}.prize-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.prize{font-size:13px}.spin{border-width:3px}.pointer{border-left-width:13px;border-right-width:13px;border-top-width:30px}}
</style></head><body><main class="wrap"><div class="eyebrow">TAICHUNG SHOPPING FESTIVAL</div><h1 class="title">BAW × 台中購物節</h1><p class="subtitle">✦ 幸運大轉盤 ✦　好禮等你帶回家</p><div class="stage"><canvas id="wheel" width="1000" height="1000" aria-label="11格幸運大轉盤"></canvas><div class="pointer"></div><button id="spin" class="spin">立即<br>抽獎<small>SPIN</small></button></div><div class="result" id="result" aria-live="polite">按下轉盤中央按鈕，試試你的好手氣！抽獎次數不限。</div><section class="prizes"><h2>🎁 活動獎品一覽</h2><div class="prize-grid" id="prizes"></div></section><p class="foot">BAW 專利空調氣墊鞋｜活動獎項依現場公告及實際庫存為準</p></main><div id="overlay" class="overlay" role="dialog" aria-modal="true"><div class="modal"><div style="font-size:52px">🎉</div><h2>恭喜中獎！</h2><div class="award" id="award"></div><p id="extra"></p><p style="font-size:16px;line-height:1.7;font-weight:700">感謝參與BAW活動，煩請將畫面出示給門市人員</p><button id="close">開心收下</button></div></div><script>
const prizes=[{name:'鞋油',sub:'＋再抽一次',p:5},{name:'鞋把',sub:'＋再抽一次',p:5},{name:'襪子',sub:'',p:2},{name:'現金折扣100元',sub:'＋再抽一次',p:5},{name:'現金折扣300元',sub:'',p:10},{name:'現金折扣500元',sub:'',p:64.425},{name:'現金折扣800元',sub:'',p:5},{name:'現金折扣1000元',sub:'',p:2.5},{name:'現金折扣1500元',sub:'',p:1},{name:'0928／0927拖鞋一雙',sub:'',p:.05},{name:'價值5600元鞋款一雙',sub:'最大獎',p:.025}];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),N=prizes.length,step=Math.PI*2/N,center=500,R=460;let angle=0,busy=false;
const lines=prizes.map((_,i)=>String(i+1).padStart(2,'0'));
function draw(){ctx.clearRect(0,0,1000,1000);ctx.save();ctx.translate(center,center);ctx.rotate(angle);for(let i=0;i<N;i++){let a=-Math.PI/2+(i-.5)*step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a,a+step);ctx.closePath();ctx.fillStyle=i%2===0?'#ffedbf':'#ba2848';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#d7a448';ctx.stroke();ctx.save();ctx.rotate(i*step);ctx.translate(0,-302);ctx.fillStyle=i%2===0?'#6b1933':'#fff6dc';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 58px Microsoft JhengHei, sans-serif';ctx.fillText(lines[i],0,0,170);ctx.restore()}ctx.beginPath();ctx.arc(0,0,R+9,0,Math.PI*2);ctx.lineWidth=24;ctx.strokeStyle='#f3bf66';ctx.stroke();for(let j=0;j<44;j++){let a=j*2*Math.PI/44;ctx.beginPath();ctx.arc(Math.cos(a)*(R+9),Math.sin(a)*(R+9),5,0,Math.PI*2);ctx.fillStyle='#fff9d7';ctx.fill()}ctx.restore()}
function rand(){if(window.crypto&&window.crypto.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}return Math.random()}
function pick(){let x=rand()*100;for(let i=0;i<N;i++){x-=prizes[i].p;if(x<0)return i}return N-1}
const ease=t=>1-Math.pow(1-t,4);document.getElementById('prizes').innerHTML=prizes.map((p,i)=>`<div class="prize ${i===10?'jackpot':''}"><b>${String(i+1).padStart(2,'0')}.</b> ${p.name}${p.sub?` <span class="tag">${p.sub}</span>`:''}</div>`).join('');
function celebrate(){for(let i=0;i<90;i++){let el=document.createElement('i');el.className='confetti';el.style.left=rand()*100+'vw';el.style.background=['#ffe08d','#ff477a','#fff','#68d5db'][i%4];el.style.animationDelay=rand()*.6+'s';el.style.setProperty('--dx',(rand()*240-120)+'px');el.style.setProperty('--rot',(rand()*1200)+'deg');document.body.appendChild(el);setTimeout(()=>el.remove(),3700)}}
function spin(){if(busy)return;busy=true;document.getElementById('spin').disabled=true;document.getElementById('result').textContent='幸運轉盤旋轉中…';const idx=pick(),current=((angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2),desired=(((-idx*step)%(Math.PI*2))+(Math.PI*2))%(Math.PI*2),delta=((desired-current+Math.PI*2)%(Math.PI*2))+Math.PI*2*6,start=performance.now(),from=angle;function tick(now){let t=Math.min(1,(now-start)/3000);angle=from+delta*ease(t);draw();if(t<1){requestAnimationFrame(tick)}else{angle=desired;draw();let p=prizes[idx];document.getElementById('result').innerHTML=`🎊 恭喜抽中：<strong>${p.name}</strong>${p.sub?'｜'+p.sub:''}`;document.getElementById('award').textContent=p.name;document.getElementById('extra').textContent=[0,1,3].includes(idx)?`🎟️ 恭喜獲得再抽一次！`:(idx===10?'🏆 超級幸運！最大獎得主就是你！':'');document.getElementById('overlay').classList.add('show');celebrate();busy=false;document.getElementById('spin').disabled=false}}requestAnimationFrame(tick)}
document.getElementById('spin').addEventListener('click',spin);document.getElementById('close').addEventListener('click',()=>document.getElementById('overlay').classList.remove('show'));draw();
</script></body></html>
